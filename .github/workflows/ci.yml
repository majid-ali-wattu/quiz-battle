name: CI-Manual-Dispatch

on:
  workflow_dispatch:
    inputs:
      target_branch:
        description: 'Select the target branch for this run'
        required: true
        default: 'qa'
        type: choice
        options:
          - qa
          - develop
      run_lint:
        description: 'Run Linting checks?'
        required: true
        default: true
        type: boolean
      run_tests:
        description: 'Run Unit Tests?'
        required: true
        default: true
        type: boolean
      push_images:
        description: 'Push Docker images to Docker Hub?'
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}-${{ github.event.inputs.target_branch }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        if: ${{ github.event.inputs.run_lint == 'true' }}
        run: npm run lint

      - name: Build
        run: npm run build

  django:
    name: ${{ matrix.service }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, game_service]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: ${{ matrix.service }}/requirements.txt

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install flake8

      - name: Lint (syntax errors and undefined names)
        if: ${{ github.event.inputs.run_lint == 'true' }}
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check for missing migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Run tests
        if: ${{ github.event.inputs.run_tests == 'true' }}
        run: python manage.py test

  docker:
    name: docker (${{ matrix.service }})
    needs: [frontend, django]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [auth_service, game_service, frontend]
    env:
      PUSH: ${{ inputs.push_images }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.target_branch }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        if: env.PUSH == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKER_USERNAME || 'local' }}/quiz-battle-${{ matrix.service }}
          tags: |
            type=raw,value=${{ github.event.inputs.target_branch }}
            type=sha

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.service }}
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  notify-slack:
    needs: [frontend, django, docker]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Determine pipeline status
        id: status
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "conclusion=failure" >> "$GITHUB_OUTPUT"
            echo "color=#ff0000" >> "$GITHUB_OUTPUT"
          else
            echo "conclusion=success" >> "$GITHUB_OUTPUT"
            echo "color=#36a64f" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Docker Hub image links
        id: images
        if: inputs.push_images && needs.docker.result == 'success'
        env:
          DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        run: |
          links='\nImages pushed to Docker Hub:'
          for service in auth_service game_service frontend; do
            name="$DOCKER_USERNAME/quiz-battle-$service"
            links="$links\n• <https://hub.docker.com/r/$name|$name>"
          done
          echo "links=$links" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "attachments": [
                {
                  "color": "${{ steps.status.outputs.color }}",
                  "title": "CI Pipeline Execution: ${{ steps.status.outputs.conclusion }}",
                  "text": "Repository: *${{ github.repository }}*\nTarget Branch: *${{ github.event.inputs.target_branch }}*\nTriggered by: *${{ github.actor }}*\nResult: *${{ steps.status.outputs.conclusion }}*${{ steps.images.outputs.links }}",
                  "actions": [
                    {
                      "type": "button",
                      "text": "View Run",
                      "url": "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
                    }
                  ]
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          SLACK_WEBHOOK_TYPE: INCOMING_WEBHOOK
